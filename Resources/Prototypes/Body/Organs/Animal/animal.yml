- type: entity
  id: BaseAnimalOrganUnGibbable
  parent: BaseItem
  abstract: true
  components:
  - type: Organ
    # backmen edit
    intCap: 13
    integrity: 13
    integrityThresholds:
      Normal: 13
      Damaged: 6
      Destroyed: 0
  - type: Edible
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
  - type: StaticPrice
    price: 50
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: FlavorProfile
    flavors:
      - chicken # everything kinda tastes like chicken
  - type: Tag
    tags:
      - Meat

- type: entity
  id: BaseAnimalOrgan
  parent: BaseAnimalOrganUnGibbable
  abstract: true
  components:
  - type: Gibbable

- type: entity
  parent: SolutionStomach
  id: SolutionMouseStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 30

- type: entity
  id: OrganMouseStomach
  parent: OrganAnimalStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionManager
    solutions:
    - SolutionMouseStomach
  - type: Item
    size: Small
    heldPrefix: stomach

- type: entity
  # start-backmen: animal-brain-nubody
  # Must share OrganBaseBrain (category: Brain) so surgery can swap with OrganHumanBrain.
  id: OrganAnimalBrain
  parent: OrganBaseBrain
  name: animal brain
  description: "Not so intelligence, not so honk."
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    layers:
    - state: brain
  - type: FlavorProfile
    flavors:
      - people
  - type: Tag
    tags:
      - Meat
  # end-backmen: animal-brain-nubody

- type: entity
  # start-backmen: animal-eyes-nubody
  id: OrganAnimalEyes
  parent: OrganBaseEyes
  name: animal eyes
  description: "I see you!"
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    layers:
      - state: eyeball-l
      - state: eyeball-r
  # end-backmen: animal-eyes-nubody
