- type: entity
  abstract: true
  id: BaseStationNanotrasen
  components:
    - type: NpcFactionMember
      factions:
        - NanoTrasen

- type: entity
  id: StandardNanotrasenStation
  parent:
    - BaseStation
    - BaseStationGoal # Corvax
    - BaseStationNews
    - BaseStationCargo
    - BaseStationJobsSpawning
    - BaseStationRecords
    - BaseStationArrivals
    - BaseStationGateway
    - BaseStationShuttles
    - BaseStationCentcomm
    - BaseStationEvacuation
    - BaseStationAlertLevels
    - BaseStationMagnet
    - BaseStationExpeditions
    - BaseStationSiliconLawNTDefault # Corvax-NTDefault
    - BaseStationSalvageJobs
    - BaseStationSiliconLawCrewsimov
    - BaseStationAllEventsEligible
    - BaseStationNanotrasen
    - BaseStationDeliveries
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform

- type: entity
  id: NanotrasenCentralCommand
  save: false
  parent:
    - BaseStation
    - BaseStationAlertLevels
    - BaseStationNanotrasen
    - BkmCCBaseStationCargo # backmen: centcomm-cargo
    - BaseStationJobsSpawning # backmen: centcomm-jobs
    - BaseStationRecords # backmen: centcomm-records
    - BkmCCBaseStationShuttles # backmen: centcomm-shuttles
    - BaseStationExpeditions # backmen: centcomm-expeditions
    - BaseStationMagnet # backmen: centcomm-magnet
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform
    # start-backmen: centcomm-director
    - type: StationCentCommDirector
      eventSchedule: # offsets from previous event; schedule starts on RoundStarted
      - 0: Noop # zero-point so the next entry's delta arms the real schedule
      - 600: AddWorker #10min
      - 600: AddWorker #20min
      - 600: AddWorker #30min
      - 600: AddOperator #40min
      - 1: AddSecurity
      - 1: AddSecurity
      - 600: AddCargo
      availableMedJobs:
        BKCCOperator: [ 1, 1 ]
        BKCCCargo: [ 0, 1 ]
        BKCCSecOfficer: [ 1, 2 ]
        BKCCAssistant: [ 2, 2 ]
      availableHighJobs:
        BKCCOperator: [ 1, 1 ]
        BKCCCargo: [ 1, 2 ]
        BKCCSecOfficer: [ 2, 4 ]
        BKCCAssistant: [ 2, 5 ]
    # end-backmen: centcomm-director

- type: entity
  id: StandardStationArena
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationRecords
  - BaseStationNanotrasen
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform
