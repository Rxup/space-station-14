# Shared simple-mob settings without a damage model.
# Injurable branch: * + MobDamageable. Surgery branch: * + MobDamageableSurgery (see _Backmen/.../simplemob_surgery.yml).

# start-backmen: simplemob-damage-split
- type: entity
  save: false
  parent:
  - BaseMob
  - MobPolymorphable
  id: BaseSimpleMobCore
  suffix: AI
  abstract: true
  components:
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [Touch, Ingestion]
  - type: Internals
  - type: MovementSpeedModifier
    baseWalkSpeed : 4
    baseSprintSpeed : 4
  - type: StatusEffects
    allowed:
    - Stutter
    - Electrocution
    - Pacified
    - SeeAll
    - RadiationProtection
    - Adrenaline
  - type: Buckle
  - type: StandingState
  - type: Tag
    tags:
    - DoorBumpOpener
    - StunImmune

- type: entity
  save: false
  parent:
  - BaseSimpleMobCore
  - MobDamageable
  id: BaseSimpleMob
  suffix: AI
  abstract: true

- type: entity
  abstract: true
  parent:
  - BaseSimpleMobCore
  - MobAtmosExposed
  - MobCombat
  - MobBloodstream
  - MobFlammable
  - BaseMobAnimal
  id: SimpleSpaceMobBaseCore
  suffix: AI
  components:
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
  - type: Climbing
  - type: NameIdentifier
    group: GenericNumber
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  - type: MobPrice
    price: 1000 # Living critters are valuable in space.
  - type: Perishable
  - type: LanguageSpeaker
    currentLanguage: SpaceMob
  - type: LanguageKnowledge #backmen: languages
    speaks:
    - SpaceMob
    understands:
    - SpaceMob
    - TauCetiBasic

- type: entity
  abstract: true
  parent:
  - SimpleSpaceMobBaseCore
  - MobDamageable
  id: SimpleSpaceMobBase # Mob without barotrauma, freezing and asphyxiation (for space carps!?)
  suffix: AI

- type: entity
  parent:
  - MobRespirator
  - MobAtmosStandard
  - SimpleSpaceMobBaseCore
  id: SimpleMobBaseCore # for air breathers
  suffix: AI
  abstract: true
  components:
  - type: DiseaseCarrier
  - type: Hunger
    thresholds: # only animals and rats are derived from this prototype so let's override it here and in rats' proto
      Overfed: 100
      Okay: 50
      Peckish: 25
      Starving: 10
      Dead: 0
    baseDecayRate: 0.00925925925926 # it is okay for animals to eat and drink less than humans, but more frequently
  - type: Thirst
    thresholds:
      OverHydrated: 200
      Okay: 150
      Thirsty: 100
      Parched: 50
      Dead: 0
    baseDecayRate: 0.04
  - type: StatusEffects
    allowed:
    - Stutter
    - Electrocution
    - Pacified
    - StaminaModifier
    - RadiationProtection
    - Adrenaline
    - PsionicsDisabled #backmen
    - PsionicallyInsulated #backmen
    - SeeAll #backmen
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 150
  - type: MobPrice
    price: 150
  - type: FloatingVisuals

- type: entity
  parent:
  - SimpleMobBaseCore
  - MobDamageable
  id: SimpleMobBase # for air breathers
  suffix: AI
  abstract: true
# end-backmen: simplemob-damage-split
