- type: entity
  id: OperatingTable
  parent: Bed
  name: operating table
  description: Special medical table for surgery. This one just seems to be a useless prop, though.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
    noRot: true
  - type: Icon
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
  - type: AmbientMusicMarkerMedical
  # start-backmen: operating-table
  - type: OperatingTable
  - type: ItemSlots
    slots:
      gas_tank_slot:
        name: comp-gas-canister-slot-name-gas-tank
        priority: 1
        whitelist:
          components:
          - GasTank
  - type: ContainerContainer
    containers:
      gas_tank_slot: !type:ContainerSlot {}
  # end-backmen: operating-table
