- type: entity
  parent: BaseThiefObjective
  id: ThiefRaiseGlimmerObjective
  name: Raise station glimmer to 1000Ψ.
  description: Pump the noösphere surrounding the station to at least 1000Ψ.
  components:
  - type: Objective
    difficulty: 2.5
    icon:
      sprite: Backmen/Icons/psi.rsi
      state: psi
  - type: RaiseGlimmerCondition
    target: 1000

- type: entity
  parent: BaseThiefObjective
  id: ThiefBecomePsionicObjective
  name: Become psionic
  description: We need you to acquire psionics and keep them until your mission is complete.
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Backmen/Clothing/Head/Hats/tinfoil.rsi
      state: icon
  - type: BecomePsionicCondition

- type: entity
  parent: BaseThiefObjective
  id: ThiefSupercritAnomaliesObjective
  name: Cause 2 anomalies to go supercritical.
  description: Introduce the station crew to the fire they're playing with.
  components:
  - type: Objective
    difficulty: 2
    icon:
      sprite: Structures/Specific/anomaly.rsi
      state: anom1
  - type: SupercriticalAnomaliesCondition
  - type: NumberObjective
    min: 2
    max: 3
    title: objective-condition-supercrit-anomalies-title
