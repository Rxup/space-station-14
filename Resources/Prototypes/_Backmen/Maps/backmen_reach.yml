- type: gameMap
  id: BackmenReach
  mapName: 'Reach'
  mapPath: /Maps/Backmen/backmen_reach.yml
  minPlayers: 0
  maxPlayers: 12
  stations:
    Reach:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Reach Transport {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'SC'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Backmen/Shuttles/emergency_BackmenReach.yml
        - type: StationJobs
          availableJobs: # 17 jobs total w/o latejoins, 21 jobs total w/ latejoins
            #command (2)
            Captain: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            BlueShield: [1, 1]
            ChiefEngineer: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            #service (4)
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 1 ]
            Chef: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            #engineering (2 - 3)
            AtmosphericTechnician: [ 1, 1 ]
            StationEngineer: [ 1, 2 ]
            #medical (2 - 3)
            Chemist: [ 1, 1 ]
            MedicalDoctor: [ 1, 2 ]
            MedicalIntern: [ 1, 1 ]
            #science (1)
            Scientist: [ 1, 1 ]
            #security (1 - 3)
            SecurityOfficer: [ 1, 3 ]
            Warden: [ 1, 1 ]
            Prisoner: [ 1, 1]
            #supply (2)
            CargoTechnician: [ 1, 1 ]
            SalvageSpecialist: [ 1, 1 ]
            #civilian (3+)
            Passenger: [ -1, -1 ] #infinite, not counted
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            #синтетики #Rebel
            BKBPLATech: [1, 1]
            BKBPLAMED: [1, 1]
        # backmen blob-config-start LOW
        - type: StationBlobConfig
          stageBegin: 15
          stageCritical: 200
          stageTheEnd: 400
          specForceTeam: RXBZZBlobLow
        # backmen blob-config-end
