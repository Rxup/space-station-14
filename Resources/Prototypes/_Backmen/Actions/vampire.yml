- type: entity
  id: VmpShop
  parent: BaseAction
  name: Evolution Shop
  description: Here you can purchase active skills and passive enhancements.
  components:
  - type: Action
  - type: Sprite
    layers:
      - texture: Interface/Actions/fleshCultistShop.png
  - type: InstantAction
    event: !type:VampireShopActionEvent

- type: entity
  id: ActionConvertToVampier
  parent: BaseAction
  name: vampire action convert
  components:
  - type: Action
    priority: -1
    useDelay: 120
    checkCanInteract: true
  - type: Sprite
    sprite: Backmen/Interface/Actions/vampire.rsi
    layers:
      - state: bat
  - type: EntityTargetAction
    event: !type:InnateNewVampierActionEvent
  - type: TargetAction
    checkCanAccess: true
    range: 3
