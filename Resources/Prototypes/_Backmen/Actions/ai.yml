- type: entity
  id: AIEyeCamShootAction
  parent: BaseAction
  name: stun shot
  description: destabilizing shot in some point
  components:
  - type: Action
    useDelay: 3
    priority: 17
    checkCanInteract: false
  - type: Sprite
    layers:
      - texture: Backmen/Actions/AI/camera_stun.png
  - type: TargetAction
    checkCanAccess: false
    range: -1
  - type: WorldTargetAction
    event: !type:AIEyeCampShootActionEvent

- type: entity
  id: AIEyeCamAction
  parent: BaseAction
  name: AI cameras
  description: Can jump on target cameras.
  components:
  - type: Action
    useDelay: 5
    priority: 17
    checkCanInteract: false
  - type: Sprite
    layers:
      - texture: Backmen/Actions/AI/camera.png
  - type: InstantAction
    event: !type:AIEyeCampActionEvent
