- type: entity
  id: OrganDemonStomach
  parent: BaseHumanOrgan
  name: stomach-demon
  description: "Gross. This is hard to stomach."
  components:
  - type: Sprite
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: SolutionManager
    solutions:
    - SolutionDemonStomach
  - type: Stomach
  - type: Organ # backmen: surgery
    slotId: stomach
  # The stomach metabolizes stuff like foods and drinks.
  # TODO: Have it work off of the ent's solution container, and move this
  # to intestines instead.
  - type: Metabolizer
    # mm yummy
    maxReagents: 3
    metabolizerTypes: [Human]
    stages: [ Digestion ]

- type: entity
  parent: Solution
  id: SolutionDemonStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: stomach
    solution:
      maxVol: 50
