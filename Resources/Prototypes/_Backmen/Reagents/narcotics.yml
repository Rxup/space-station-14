# Super Stimulants
- type: reagent
  id: StimulantsSuper
  name: reagent-name-stimulants-super
  group: Narcotics
  desc: reagent-desc-stimulants-super
  physicalDesc: reagent-physical-desc-energizing
  flavor: sharp
  color: "#DC143C"
  boilingPoint: 212.0
  meltingPoint: 170.0
  metabolisms:
    Bloodstream:
      metabolismRate: 0.5
      effects:
      - !type:MovementSpeedModifier # This is frickin' fast
        walkSpeedModifier: 1.5
        sprintSpeedModifier: 1.5
      - !type:HealthChange
        conditions:
          - !type:ReagentCondition
            reagent: StimulantsSuper
            min: 16
        damage: # If you get robust too much, you can go to hell!
          types:
            Poison: 4
      - !type:AdjustPainFeels
        conditions:
        - !type:ReagentCondition
          reagent: StimulantsSuper
          min: 16
        amount: 0.4 # haha
      - !type:GenericStatusEffect
          key: Stutter
          component: StutteringAccent
      - !type:Jitter
      - !type:SuppressPain
        amount: 3
        time: 60 # it accumulated 1.2*quantity and then exists for 60 seconds.
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDesoxyStamina
        time: 5
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 5
        type: Remove
      - !type:ModifyKnockdown
        time: 5
        type: Remove
      - !type:PopupMessage
        visualType: Medium
        messages: ["ephedrine-effect-tight-pain", "ephedrine-effect-heart-pounds"]
        type: Local
        probability: 0.10
      - !type:ResetNarcolepsy
      - !type:SatiateHunger
        factor: 1.0
      - !type:SatiateThirst
        factor: 1.0
      - !type:ModifyBleed # Tranexamic acid in recipe, so it also stops bleeding, but not that efficient
        amount: -1
      - !type:HealthChange
        damage:
          types:
            Heat: -1.5
            Shock: -1.5
            Cold: -1.5
            Caustic: -1.5
            Blunt: -1.5
            Slash: -1.5
            Piercing: -1.5
            ArmorPiercing: -1.5
            Asphyxiation: -2
            Bloodloss: -2
- type: reagent
  id: Morphine
  name: reagent-name-morphine
  group: Narcotics
  desc: reagent-desc-morphine
  physicalDesc: reagent-physical-desc-opaque
  flavor: bitter
  color: "#A9FBFB"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:AdjustPainFeels
        conditions:
        - !type:ReagentCondition
          reagent: Morphine
          min: 20
        amount: 0.2
        randomise: false # SKYROCKETS your pain feels
      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: Morphine
          min: 6
        emote: Yawn
        showInChat: true
        probability: 0.1
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Morphine
          min: 12
        effectProto: StatusEffectDrowsiness
        time: 30
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Morphine
          min: 20
        effectProto: StatusEffectForcedSleeping
        time: 10
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Morphine
          min: 25
        damage:
          types:
            Poison: 1.25
      - !type:SuppressPain
        amount: 100
        time: 60
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Morphine
          min: 10
        key: Adrenaline
        component: IgnoreSlowOnDamage
        time: 30

