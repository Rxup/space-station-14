- type: alert
  id: PsionicInvisibility
  icons: [ /Textures/Backmen/Interface/VerbIcons/psionic_invisibility.png ]
  name: alerts-PsionicInvisibility-name
  description: alerts-PsionicInvisibility-desc
  clickEvent: !type:CancelPsionicInvisibilityAlertEvent

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectPsionicInvisibility
  name: psionic invisibility
