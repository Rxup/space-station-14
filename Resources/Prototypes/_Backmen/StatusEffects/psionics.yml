- type: alert
  id: PsionicInsulation
  icons: [ /Textures/Backmen/Interface/Alerts/Psi/Insulated.png ]
  name: alerts-PsionicInsulation-name
  description: alerts-PsionicInsulation-desc

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectPsionicallyInsulated
  name: psionically insulated
  components:
