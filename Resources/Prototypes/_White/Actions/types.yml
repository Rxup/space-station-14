- type: entity
  id: ActionHeadcrabJump
  parent: BaseAction
  name: Jump
  description: Do super jump.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: _White/Interface/Actions/headcrab.rsi
    layers:
    - state: jump-off
      map: ["enum.ActionVisuals.Icon"]
    - state: jump-on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: WorldTargetAction
    event: !type:FleshWormJumpActionEvent
  - type: TargetAction
    range: 160
