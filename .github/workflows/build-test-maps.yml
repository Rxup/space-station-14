name: Build & Test Maps

# Heavy map-load integration tests (PostMapInitTest: every GameMap + shuttle/grid load).
# Split from Build & Test Debug so the main suite does not hang on map I/O.

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run Content.IntegrationTests (maps)
      shell: pwsh
      timeout-minutes: 150
      run: |
        $env:DOTNET_gcServer=1
        # PostMapInitTest = GameMapsLoadable + NonGameMaps + shuttles/grids
        # StationPowerTests / SalvageTest also load full station maps
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter "FullyQualifiedName~PostMapInitTest|FullyQualifiedName~StationPowerTests|FullyQualifiedName~SalvageTest" -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results_maps"

    - name: Archive NUnit3 map test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-maps
        path: test_results_maps/*
        retention-days: 7
        compression-level: 9

  ci-success:
    name: Build & Test Maps
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
